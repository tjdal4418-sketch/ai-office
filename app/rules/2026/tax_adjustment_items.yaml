# 세무조정 체크리스트 항목 정의 — 사무실 업무 절차 (법령 수치 아님, 수치는 corptax.yaml)
# primary : 잔액을 합산해 '검토 필요 여부'를 판단하는 계정과목 이름 (시산표의 계정과목과 같아야 함)
# related : 참고로 잔액을 함께 보여주는 계정과목
# calc    : 전용 계산 (entertainment 기업업무추진비 한도 / imputed 가지급금 인정이자 / bad_debt 대손충당금 한도 / vehicle 업무용승용차 안내)
# 근거 조문 표기 중 '확인 필요'가 붙은 것은 아직 조문을 확인하지 못한 항목입니다. 항목·확인 포인트는 사무실 절차에 맞게 보정하세요.
# 기업업무추진비(구 접대비): 고객사 계정과목표에 '접대비'로 남아 있는 경우가 많아 두 이름을 모두 합산한다.
